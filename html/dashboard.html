<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <title>Game Data Dashboard</title>
    <link rel="stylesheet" href="../css/general.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <main class="dashboard-container">
        <header class="top-nav">
            <nav aria-label="Dashboard navigatie">
                <a href="../index.html" class="btn-moves">⬅ Back to Team</a>
                <a href="/game.json" class="btn-moves" target="_blank">View Raw JSON ➡</a>
            </nav>
            <h1>Live Player Moves</h1>
        </header>

        <section class="data-section" aria-labelledby="table-title">
            <h2 id="table-title" class="hidden-title">Move Data Tabel</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nr</th>
                            <th>Turn</th>
                            <th>Start</th>
                            <th>End</th>
                            <th>Start Loc</th>
                            <th>End Loc</th>
                        </tr>
                    </thead>
                    <tbody id="data-output">
                        </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
                function formatTime(timeStr) {
            if (!timeStr) return '';
            return timeStr.substring(11, 19);
        }

        fetch('/game.json')
            .then(res => res.json())
            .then(data => {
                let output = '';
                data.forEach(move => {
                    output += `
                        <tr>
                            <td>${move.move_id || ''}</td>
                            <td>${move.move_number || ''}</td>
                            <td>${move.turn_id || ''}</td>
                            <td class="time-text">${formatTime(move.start_time)}</td>
                            <td class="time-text">${formatTime(move.end_time)}</td>
                            <td>${move.start_location || ''}</td>
                            <td>${move.end_location || move.end_locaton || ''}</td>
                        </tr>
                    `;
                });
                document.getElementById('data-output').innerHTML = output;
            })
            .catch(() => {
                document.getElementById('data-output').innerHTML = '<tr><td colspan="7">Error fetching data.</td></tr>';
            });
    </script>
</body>
</html>
